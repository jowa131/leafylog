server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    absolute_redirect off;

    # 에러 로그 수집 API → log_server 컨테이너로 리버스 프록시
    location /leafylog/api/log {
        proxy_pass         http://log_server:5000/api/log;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 10s;
    }

    # APK 다운로드 — 1일 캐시 허용
    location ~* ^/leafylog/.*\.apk$ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400";
    }

    # version.json — 앱 버전 체크용, 항상 최신 반영
    location = /leafylog/version.json {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
        add_header Access-Control-Allow-Origin "*";
    }

    # HTML — 항상 최신 버전 제공 (캐시 비활성화)
    location ~* ^/leafylog/.*\.html$ {
        root  /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # 정적 파일 서빙 (APK, HTML 등) — 위 규칙에 걸리지 않은 경로 처리
    location /leafylog/ {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # 루트 접근 — 기본 안내 페이지
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
