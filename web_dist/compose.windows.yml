services:
  leafylog-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8082:80"
    depends_on:
      - log_server
    restart: unless-stopped

  log_server:
    build:
      context: ./log_server
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - leafylog_logs:/data
    restart: unless-stopped

volumes:
  leafylog_logs:
